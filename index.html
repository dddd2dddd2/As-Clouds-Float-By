<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云浮集 — As Clouds Float By</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Long+Cang&&display=block" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="main-nav">
    <div class="nav-inner">
      <a class="nav-brand" href="#hero">云浮集</a>
      <div class="nav-links">
        <a class="nav-link" href="#hero">卷首</a>
        <a class="nav-link" href="#collection">目录</a>
        <a class="nav-link" href="#footer">关于</a>
      </div>
      <button class="nav-toggle" id="nav-toggle" aria-label="菜单" aria-expanded="false">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
    </div>
  </nav>

  <section id="hero">
    <div class="hero-bg"></div>
    <div class="hero-content">
      <p class="hero-en">As Clouds Float By</p>
      <h1 class="hero-title">云 浮 集</h1>
      <div class="hero-divider"></div>
      <p class="hero-quote">莫问春迟，且看云浮</p>
      <p class="hero-sub-quote">浮云也有归时节</p>
      <a class="hero-cta" href="#collection">翻阅诗集</a>
    </div>
  </section>

  <section id="filter-section">
    <div class="filter-bar">
      <div class="volume-tabs" id="volume-tabs"></div>
      <div class="search-group">
        <input type="text" id="search-input" placeholder="检索诗词、句子或词牌…">
      </div>
      <!-- 切换横竖排按钮 -->
      <button class="btn-layout" id="btn-toggle-layout" title="切换横排/竖排">
        <span class="layout-text" id="layout-text">竖排</span>
      </button>
      <!-- 切换简繁体按钮 -->
      <button class="btn-layout" id="btn-toggle-lang" title="切换简繁体">
        <span class="lang-text" id="lang-text">繁体</span>
      </button>
    </div>
  </section>

  <main id="collection">
    <div class="poems-container" id="poems-container"></div>
  </main>

  <div class="modal" id="poem-modal">
    <div class="modal-overlay"></div>
    <div class="poem-cinematic-bg" id="poem-cinematic-bg"></div>

    <!-- 水墨晕染与云雾动态背景层 -->
    <div class="ink-splash-overlay">
      <div class="ink-mist-layer"></div>
      <div class="ink-drop ink-drop-1" id="ink-drop-1"></div>
      <div class="ink-drop ink-drop-2" id="ink-drop-2"></div>
    </div>

    <div class="modal-container">
      <!-- 宣纸微纹理覆膜 -->
      <div class="rice-paper-texture"></div>

      <div class="book-pagination top-pagination">
        <button class="nav-prev-poem" id="btn-prev-poem">← 上一首</button>
        <button class="nav-toc" id="btn-toc">目 录</button>
        <button class="nav-next-poem" id="btn-next-poem">下一首 →</button>
      </div>
      <div class="modal-body">
        <header class="poem-header">
          <h2 class="poem-detail-title"></h2>
          <div class="poem-meta">
            <span class="poem-genre-badge"></span>
            <span class="poem-volume-badge"></span>
          </div>
          <p class="poem-epigraph" id="poem-epigraph"></p>
        </header>
        <div class="poem-divider">❖</div>
        <div class="poem-content-area">
          <div class="poem-text"></div>
        </div>
        <p class="poem-date-location" id="poem-date-location"></p>
        <footer class="poem-footer-details">
          <div class="poem-translation-block" id="poem-translation-block">
            <h4 class="translation-label">English Translation</h4>
            <div class="poem-translation-text" id="poem-translation-text"></div>
          </div>
          <details class="author-notes-details" id="author-notes-details">
            <summary class="author-notes-summary">作者按 / 创作后记</summary>
            <div class="author-notes-content" id="author-notes-content"></div>
          </details>
          <div class="poem-images-section" id="poem-images-section">
            <div class="poem-images-gallery" id="poem-images-gallery"></div>
            <button class="btn-add-image" id="btn-add-image" title="添加/上传配图">+ 添加配图</button>
            <input type="file" id="image-upload" accept="image/*" multiple hidden>
          </div>
        </footer>
      </div>
    </div>
  </div>

  <footer id="footer">
    <div class="footer-inner">
      <p class="footer-title">云浮集 · As Clouds Float By</p>
      <p class="footer-sub">莫问春迟，且看云浮</p>
      <div class="footer-authors">
        <span class="author-label">作者 / Author</span>
        <div class="author-links">
          <a href="https://github.com/dddd2dddd2" target="_blank" rel="noopener noreferrer">dddd2dddd2</a>
          <span class="author-sep">·</span>
          <a href="https://github.com/hippohippo-ai" target="_blank" rel="noopener noreferrer">hippohippo-ai</a>
        </div>
      </div>
    </div>
  </footer>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-overlay"></div>
    <button class="lightbox-close" aria-label="关闭">&times;</button>
    <button class="lightbox-prev" aria-label="上一张">‹</button>
    <button class="lightbox-next" aria-label="下一张">›</button>
    <img class="lightbox-image" id="lightbox-image" alt="配图大图预览">
  </div>

  <!-- OpenCC 简繁转换支持库 -->
  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
  <script src="script.js"></script>
</body>
</html>
